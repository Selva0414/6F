<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | 6F IT School</title>
  <meta name="description" content="Contact 6F IT School for course information and counselling.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="section">
    <div class="container reveal">
      <span class="eyebrow">Contact Us</span>
      <h1 class="section-title">Talk to the 6F IT School Team</h1>
      <div class="grid grid-2">
        <article class="card">
          <h2>Contact Information</h2>
          <p><strong>Phone:</strong> Add official number</p>
          <p><strong>Email:</strong> Add official email</p>
          <p><strong>Location:</strong> Add campus address</p>
          <p class="muted">Office hours and response time can be added by the team.</p>
        </article>
        <article class="card">
          <h2>Quick Enquiry</h2>
          <form class="form-grid" data-demo-form>
            <label>Full Name<input required></label>
            <label>Phone<input required type="tel"></label>
            <label class="full-span">Message<textarea required placeholder="Tell us the course you are interested in."></textarea></label>
            <button class="btn btn-primary" type="submit">Send Message</button>
            <p class="form-note muted"></p>
          </form>
        </article>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
</body>
</html>
